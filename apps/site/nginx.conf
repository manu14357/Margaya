# Hashed build assets never change; pages and their RSC payloads must
# revalidate so a redeploy is visible immediately.
map $uri $site_cache_control {
    ~^/_next/static/                                 "public, max-age=31536000, immutable";
    ~\.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?)$  "public, max-age=86400";
    default                                          "no-cache";
}

server {
    listen 3001;
    server_name _;
    root /usr/share/nginx/html;

    # Relative redirects keep the published host and port behind proxies and
    # Docker port mappings.
    absolute_redirect off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $site_cache_control;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml image/svg+xml;
    gzip_comp_level 6;

    error_page 404 /404.html;

    # Defense in depth if a build leaves a source map in the static directory.
    location ~* \.map$ {
        return 404;
    }

    # The export uses trailingSlash: false (/docs/core is docs/core.html), so
    # /docs/core/ redirects to its canonical form, as `next start` does.
    location ~ ^(?<route>.+)/$ {
        return 308 $route$is_args$args;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
