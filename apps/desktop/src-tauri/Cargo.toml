[package]
name = "margaya-desktop"
version = "0.1.0"
description = "Margaya Desktop"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "margaya_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "dynamic-acl"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-deep-link = "2.6"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-log = "2.10"
tauri-plugin-notification = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tauri-plugin-updater = "2.14"
tauri-plugin-window-state = "2.5"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
iana-time-zone = "0.1"
# Linux: the freedesktop Secret Service (GNOME Keyring, KWallet), over the
# libdbus Tauri already links, with pure-Rust session encryption.
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "http2", "charset", "system-proxy"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sys-locale = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "sync", "time"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
# ShellExecuteExW with COM for opening links, WebView2's load-failure
# status for the offline page, toast notifications (WinRT) and their sound
# (PlaySoundW). The same versions Tauri itself uses.
webview2-com = "0.39"
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The unread count on the dock icon (com.canonical.Unity.LauncherEntry). The
# same zbus Tauri's plugins already use.
zbus = "5"

[features]
# Test builds only, never in release CI: links that would open outside the
# app are written to the file named by MARGAYA_E2E_OPEN_LOG instead.
e2e = []

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
panic = "abort"
strip = true
