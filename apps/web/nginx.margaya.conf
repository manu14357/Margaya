# Must come before the first map. Build file names (the cache map below) are
# longer than the default hash bucket allows; env.sh skips any name too long
# for this one, so nginx always starts.
map_hash_bucket_size 256;

# HSTS only for HTTPS: TLS normally ends at a proxy in front of this
# server, which says so in X-Forwarded-Proto. Browsers ignore HSTS received
# over plain HTTP, so a spoofed header there changes nothing.
map $http_x_forwarded_proto $margaya_hsts {
    default "";
    https "max-age=15552000";
}

# Build files under /assets carry a content hash in their name, so browsers
# may keep them for a year without asking again. index.html, which every app
# route falls back to, is checked on each load so a release shows at once.
# env.sh lists the build files it filled with this deployment's MARGAYA_*
# values: they keep their build names but change with the settings, so they
# are checked each time too (exact names win over the /assets/ pattern).
map $uri $margaya_cache_control {
    default "";
    /index.html "no-cache";
    include /etc/nginx/conf.d/margaya-runtime-assets*.map;
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 5173;
    server_name localhost;

    # Allow larger OAuth/Better Auth session cookies in request headers.
    client_header_buffer_size 8k;
    large_client_header_buffers 4 32k;

    # Security headers. The page policy allows what the app loads: its own
    # scripts, the optional Turnstile captcha, YouTube embeds in descriptions,
    # images from anywhere (avatars, pasted links), and API/WebSocket calls to
    # a separately hosted API or S3 upload endpoint. Every add_header here
    # applies to all locations, which define none of their own.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self' https: http: wss: ws:; frame-src 'self' https://challenges.cloudflare.com https://www.youtube.com https://www.youtube-nocookie.com; media-src 'self' blob: https:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The microphone is allowed for this site only: Ask AI dictation needs it.
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
    # Empty (so not sent) unless the request reached us over HTTPS.
    add_header Strict-Transport-Security $margaya_hsts always;
    # Empty (so not sent) outside /assets and index.html; see the map above.
    add_header Cache-Control $margaya_cache_control;
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level 6;

    location = /.well-known/oauth-protected-resource/api/mcp {
        proxy_pass http://127.0.0.1:1337/.well-known/oauth-protected-resource/api/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Margaya-Client-IP "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/oauth-authorization-server/api {
        proxy_pass http://127.0.0.1:1337/.well-known/oauth-authorization-server/api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Margaya-Client-IP "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Filled in at container start by env.sh, for the desktop app.
    location = /.well-known/margaya-desktop.json {
        default_type application/json;
        alias /usr/share/nginx/html/margaya-desktop.json;
    }

    location /.well-known/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:1337/api/;
        # The API sends its own copies of these; keep one of each.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Margaya-Client-IP "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Defense in depth if a build leaves a source map in the static directory.
    location ~* \.map$ {
        return 404;
    }

    # Browsers must always see a new service worker. `expires` rather than
    # add_header, which would drop the server's security headers here.
    location = /sw.js {
        root /usr/share/nginx/html;
        expires -1;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
