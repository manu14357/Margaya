name: Release

# Images are built and pushed under the computed version before the release
# exists, so a broken image build stops the release instead of leaving a tag, a
# GitHub Release, a Discord announcement and a Helm chart pointing at nothing.
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Version bump"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: "Preview the version and notes without releasing anything"
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    permissions:
      contents: write # semantic-release verifies push permission even on a dry run
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Enforce dispatch from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Release must be dispatched from main (current ref: $GITHUB_REF)."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve next version
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -o pipefail
          pnpm exec semantic-release --dry-run 2>&1 | tee /tmp/release-plan.log

      - name: Summarise the plan
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          {
            if [ -n "$VERSION" ]; then
              echo "## Release plan: v$VERSION"
            else
              echo "## No release"
              echo
              echo "No releasable commits since the last tag."
            fi
            echo
            echo "<details><summary>semantic-release dry run</summary>"
            echo
            echo '```'
            cat /tmp/release-plan.log
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  images:
    name: Images
    needs: plan
    if: ${{ !inputs.dry_run && needs.plan.outputs.version != '' }}
    permissions:
      contents: read
      packages: write
      id-token: write # signs and attests the images
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/build-images.yml
    secrets: inherit
    with:
      source_mode: planned
      version: ${{ needs.plan.outputs.version }}
      tags: type=raw,value=${{ needs.plan.outputs.version }}

  chart:
    name: Chart
    needs: plan
    if: ${{ !inputs.dry_run && needs.plan.outputs.version != '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/helm-validate.yml

  release:
    name: Release
    needs: [plan, images, chart]
    if: ${{ !inputs.dry_run && needs.plan.outputs.version != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      # The same token the API calls use, so the release commit and tag are not
      # pushed under a different identity than the one that was verified.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A release created with GITHUB_TOKEN does not trigger other workflows,
      # which would silence release-notify.yml.
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          PLANNED_VERSION: ${{ needs.plan.outputs.version }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          node scripts/security/verify-release-source.mjs planned "$PLANNED_VERSION"
          pnpm exec semantic-release

      - name: Verify the released version matches the built images
        env:
          PLANNED: ${{ needs.plan.outputs.version }}
          RELEASED: ${{ steps.release.outputs.version }}
        run: |
          if [ "$PLANNED" != "$RELEASED" ]; then
            echo "::error::Planned v$PLANNED but released v$RELEASED; the images published for this run are tagged v$PLANNED."
            exit 1
          fi

  promote:
    name: Promote
    needs: [plan, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Copies the published manifest, so :latest is the exact bytes released.
      # The cosign signature and attestations are keyed to that digest, so
      # they only cover :latest while the digests match.
      - name: Tag images as latest
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          for image in margaya web api; do
            ref="ghcr.io/${OWNER,,}/${image}"
            docker buildx imagetools create --tag "${ref}:latest" "${ref}:${VERSION}"
            released=$(docker buildx imagetools inspect --raw "${ref}:${VERSION}" | sha256sum)
            latest=$(docker buildx imagetools inspect --raw "${ref}:latest" | sha256sum)
            if [ "$released" != "$latest" ]; then
              echo "::warning::${ref}:latest has a different digest from ${ref}:${VERSION}, so its signature does not verify; verify by version tag."
            fi
          done

  chart-publish:
    name: Publish chart
    needs: [plan, promote]
    permissions:
      contents: read
      packages: write
      id-token: write # signs and attests the chart
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/helm-chart.yml
    with:
      version: ${{ needs.plan.outputs.version }}

  # Attaches the SBOMs, the image digests and a checksum file to the GitHub
  # Release that semantic-release just published. desktop-release.yml adds
  # the installers with their own SHA256SUMS.txt and provenance.
  assets:
    name: Release assets
    needs: [plan, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # upload release assets
      id-token: write # attest the files below
      attestations: write
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ needs.plan.outputs.version }}
          persist-credentials: false

      # Written by build-images.yml: one SPDX SBOM per image and platform,
      # and each image's digest.
      - name: Collect the image SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-image-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-assets

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # Every npm dependency (pnpm-lock.yaml) and cargo dependency
      # (apps/desktop/src-tauri/Cargo.lock) at the release tag. The desktop
      # app has no other dependencies, so this is its SBOM too.
      - name: Generate the source SBOMs
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release-assets"
          "$SYFT" scan dir:. --source-name margaya --source-version "$VERSION" \
            -o "cyclonedx-json=$out/margaya-$VERSION-source.cdx.json" \
            -o "spdx-json=$out/margaya-$VERSION-source.spdx.json"

      - name: Write the checksums
        working-directory: ${{ runner.temp }}/release-assets
        run: |
          set -euo pipefail
          cat image-*.digest.txt | sort > image-digests.txt
          rm image-*.digest.txt
          sha256sum -- *.json image-digests.txt | sort -k 2 > SHA256SUMS-sbom.txt
          cat image-digests.txt SHA256SUMS-sbom.txt

      - name: Attest the release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/release-assets/SHA256SUMS-sbom.txt

      - name: Attach them to the release
        working-directory: ${{ runner.temp }}/release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.plan.outputs.version }}
        run: gh release upload "$TAG" ./* --repo "$GITHUB_REPOSITORY" --clobber
