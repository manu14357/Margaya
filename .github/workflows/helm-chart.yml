name: Build & publish Helm chart to GHCR

on:
  pull_request:
    paths:
      - "charts/margaya/**"
      - ".github/workflows/helm-chart.yml"
      - ".github/workflows/helm-validate.yml"
  workflow_call:
    inputs:
      version:
        description: "Chart version to publish (blank validates only)"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: "Existing released version to publish from its reviewed vX.Y.Z tag"
        required: true
        type: string

env:
  CHART_PATH: charts/margaya
  REGISTRY: ghcr.io

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/helm-validate.yml

  publish:
    if: github.ref == 'refs/heads/main' && inputs.version != ''
    runs-on: ubuntu-24.04
    needs: validate
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing and attestations (GitHub OIDC)
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify publication source
        id: source
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/security/verify-release-source.mjs released "$RELEASE_VERSION"

      - name: Checkout verified release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.source.outputs.source_sha }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Validate the release chart
        run: |
          helm lint "$CHART_PATH" --set margaya.env.authSecret=validation-only-secret-at-least-32-characters --set margaya.env.clientUrl=https://margaya.example.com
          helm template margaya "$CHART_PATH" --set margaya.env.authSecret=validation-only-secret-at-least-32-characters --set margaya.env.clientUrl=https://margaya.example.com > /dev/null

      - name: Package chart
        run: |
          mkdir -p dist
          helm package "$CHART_PATH" --destination dist

      - name: Log in to GHCR
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | helm registry login "$REGISTRY" --username "$GH_ACTOR" --password-stdin

      - name: Publish chart
        id: publish
        env:
          CHART_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          CHART_REF="oci://$REGISTRY/$OWNER/charts/margaya"

          if helm show chart "$CHART_REF" --version "$CHART_VERSION" >/dev/null 2>&1; then
            echo "Chart $CHART_REF:$CHART_VERSION already exists; skipping publish."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          helm push dist/margaya-"$CHART_VERSION".tgz "oci://$REGISTRY/$OWNER/charts" 2>&1 | tee "$RUNNER_TEMP/helm-push.log"
          digest=$(sed -n 's/^Digest: \(sha256:[0-9a-f]\{64\}\)$/\1/p' "$RUNNER_TEMP/helm-push.log")
          if [ -z "$digest" ]; then
            echo "::error::helm push printed no chart digest."
            exit 1
          fi
          {
            echo "pushed=true"
            echo "name=$REGISTRY/$OWNER/charts/margaya"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: steps.publish.outputs.pushed == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # helm registry login keeps its own credentials; cosign and the
      # attestation push read the Docker config that cosign login writes.
      # Keyless signing, as for the images in build-images.yml.
      - name: Sign the chart
        if: steps.publish.outputs.pushed == 'true'
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART: ${{ steps.publish.outputs.name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | cosign login "$REGISTRY" --username "$GH_ACTOR" --password-stdin
          cosign sign --yes "$CHART@$DIGEST"

      - name: Attest build provenance
        if: steps.publish.outputs.pushed == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
