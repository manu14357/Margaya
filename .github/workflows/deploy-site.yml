name: Deploy Site to GitHub Pages

# Manual only until GitHub Pages is configured. Enable Pages (source: GitHub
# Actions) and a custom domain first: without one the site is served from the
# /Margaya project path, and the export has no basePath for it. Then restore a
# push trigger on main for apps/site/**, packages/**, pnpm-lock.yaml,
# pnpm-workspace.yaml and this file.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    name: Build static site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Download page reads the latest desktop release from the GitHub
      # API at build time; the token avoids the shared anonymous rate limit.
      - name: Build @margaya/site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm --filter @margaya/site build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/site/out

  deploy:
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
