# Global values
nameOverride: ""
fullnameOverride: ""
replicaCount: 1
# Autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
# Pod configuration
podAnnotations: {}
# fsGroup lets the image's user (uid 1001) write to the uploads volume.
podSecurityContext:
  fsGroup: 1001
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
imagePullSecrets: []
enableServiceLinks: false
# Service account configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""
# PostgreSQL database configuration
postgresql:
  # Set to true to deploy PostgreSQL as part of this chart
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  # Optional: PostgreSQL 16 with the pgvector extension, for AI semantic
  # search. Off by default; without it search stays full-text. Switching an
  # existing database keeps the data; run REINDEX DATABASE once afterwards
  # (the images sort text with different C libraries).
  pgvector:
    enabled: false
    image:
      repository: pgvector/pgvector
      tag: pg16
  # Database configuration
  auth:
    database: margaya
    username: margaya_user
    password: margaya_password
    # Use existing secret for database credentials (optional)
    existingSecret: ""
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  # Persistence for PostgreSQL data
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  # PostgreSQL service configuration
  service:
    type: ClusterIP
    port: 5432
  # Resources for PostgreSQL
  resources: {}
  # resources:
  #   limits:
  #     cpu: 500m
  #     memory: 512Mi
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi
# Margaya application configuration (combined API + web frontend)
margaya:
  image:
    repository: ghcr.io/manu14357/margaya
    # Defaults to Chart.appVersion when empty.
    tag: ""
    pullPolicy: IfNotPresent
  securityContext: {}
  service:
    type: ClusterIP
    port: 5173
    targetPort: 5173
  # Resources are optional and disabled by default
  resources: {}
  # resources:
  #   limits:
  #     cpu: 500m
  #     memory: 512Mi
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi

  env:
    # Public URL of this Margaya instance (e.g. https://margaya.example.com)
    # Required public HTTP(S) origin, e.g. https://margaya.example.com.
    # MARGAYA_API_URL is derived automatically as clientUrl/api if not set
    clientUrl: ""
    # Allowed CORS origins. Accepts a comma-separated string or YAML list.
    # Defaults to clientUrl when left empty.
    corsOrigins: []
    # Required Better Auth secret (minimum 32 characters), unless existingSecret is enabled.
    # Generate with: openssl rand -hex 32
    authSecret: ""
    existingSecret:
      enabled: false
      name: ""
      key: auth-secret
    disableRegistration: false
    disablePasswordRegistration: false
    disableEmailOtpSignIn: false
    # Per-IP limits on sign-in, email codes, magic links and password
    # reset/change. Counted in memory by each replica; keep it on.
    authRateLimitEnabled: true
    # Redis or Valkey pub/sub that relays realtime updates (boards, inbox,
    # page co-editing) between replicas. Required when replicaCount > 1 or
    # autoscaling is enabled; a single replica works without it. Sets
    # REDIS_URL. For Sentinel or Cluster, use extraEnv (REDIS_SENTINELS,
    # REDIS_CLUSTER_NODES, ...) instead.
    redis:
      # e.g. redis://margaya-redis:6379 (put URLs with a password in a Secret)
      url: ""
      existingSecret:
        # Secret holding the full redis:// or rediss:// URL; takes precedence over url
        name: ""
        key: redis-url
    # AI (off by default). Anything set here is locked in Instance → AI;
    # leave a value empty to manage it in the panel instead. Keys belong in
    # Secrets. See the docs page "AI setup".
    ai:
      # "true" or "false" locks the switch; empty lets instance admins decide.
      enabled: ""
      # anthropic (default) or openai_compatible.
      provider: ""
      anthropicApiKey:
        existingSecret:
          name: ""
          key: anthropic-api-key
      # OpenAI-compatible cloud endpoint, e.g. https://api.openai.com/v1
      openaiBaseUrl: ""
      openaiApiKey:
        existingSecret:
          name: ""
          key: openai-api-key
      # Model names per tier; empty uses the provider default
      # (claude-haiku-5-5, claude-sonnet-5-5, claude-opus-5-5).
      models:
        fast: ""
        balanced: ""
        deep: ""
      # Your own OpenAI-compatible server (Ollama, vLLM), e.g.
      # http://ollama.ai.svc:11434/v1. Restricted data only goes here.
      localBaseUrl: ""
      localModel: ""
      # "true" sends every AI call to the local model.
      localOnly: ""
      # Optional embeddings endpoint (OpenAI-compatible).
      embeddingsBaseUrl: ""
      embeddingsModel: ""
      embeddingsApiKey:
        existingSecret:
          name: ""
          key: embeddings-api-key
    # Built-in file store, used for attachments and description/comment
    # images while s3.endpoint is empty. Files are written under `path` and
    # served only through the API's authorized download route. A local disk
    # belongs to one pod: with replicaCount > 1 or autoscaling it is used
    # only on a ReadWriteMany claim (otherwise uploads stay off until S3 is
    # set). Task exports keep using PostgreSQL without S3.
    localStorage:
      enabled: true
      path: /app/apps/api/data/uploads
      persistence:
        # false keeps files in an emptyDir: they are lost when the pod goes.
        enabled: true
        size: 10Gi
        storageClass: ""
        accessMode: ReadWriteOnce
        # Use an existing PersistentVolumeClaim instead of creating one.
        existingClaim: ""
    # S3-compatible object storage (S3, R2, MinIO, ...) for attachments,
    # description/comment images and task exports. Without it, the local
    # store above holds uploads. The browser uploads straight to the
    # endpoint, so it must be reachable from users' browsers.
    s3:
      endpoint: ""
      bucket: ""
      region: us-east-1
      # true for MinIO and most self-hosted backends, false for AWS S3 and R2
      forcePathStyle: true
      keyPrefix: ""
      existingSecret:
        # Secret with the access key pair. Leave name empty to use the pod's
        # IAM role / IRSA through the AWS default credential chain.
        name: ""
        accessKeyIdKey: access-key-id
        secretAccessKeyKey: secret-access-key
    # Database configuration
    database:
      # Use external PostgreSQL (set postgresql.enabled to false)
      # Important: when using external postgres, make sure you have set up the db user correctly:
      #   CREATE DATABASE margaya;
      #   CREATE USER margaya_user WITH PASSWORD 'your_password';
      #   GRANT ALL PRIVILEGES ON DATABASE margaya TO margaya_user;
      #   \c margaya;
      #   GRANT USAGE ON SCHEMA public TO margaya_user;
      #   GRANT CREATE ON SCHEMA public TO margaya_user;
      #   ALTER SCHEMA public OWNER TO margaya_user;
      external:
        enabled: false
        host: ""
        port: 5432
        database: margaya
        username: margaya_user
        password: ""
        # Use existing secret for external database credentials in the form of a uri, e.g.: "postgresql://user:pass@host:port/db"
        existingSecret:
          enabled: false
          name: ""
          passwordKey: postgres_uri
  # Additional environment variables for the margaya container.
  # Each entry is a standard Kubernetes EnvVar (supports `value` or `valueFrom`).
  # Useful for CUSTOM_OAUTH_*, SMTP_*, etc. without editing the chart.
  # extraEnv entries are appended after chart-defined vars; duplicate names override.
  extraEnv: []
  # extraEnv:
  #   # Public website and docs (<url>/docs) the app links to; default https://margaya.app
  #   - name: MARGAYA_PUBLIC_SITE_URL
  #     value: "https://www.example.com"
  #   - name: CUSTOM_OAUTH_DISCOVERY_URL
  #     value: "https://idp.example.com/.well-known/openid-configuration"
  #   - name: CUSTOM_OAUTH_CLIENT_ID
  #     valueFrom:
  #       secretKeyRef:
  #         name: oauth-secret
  #         key: client-id
  #   # Behind an ingress controller: proxy addresses whose X-Forwarded-For
  #   # is trusted, so sign-in rate limits count each client, not the proxy.
  #   - name: TRUSTED_PROXIES
  #     value: "10.0.0.0/8"
  #   # Outgoing email (sign-in codes, invitations, notifications).
  #   - name: SMTP_HOST
  #     value: "smtp.example.com"
  #   - name: SMTP_PASSWORD
  #     valueFrom:
  #       secretKeyRef:
  #         name: margaya-smtp
  #         key: password
  #   # Requests per minute for each API key (default 600; 0 disables it),
  #   # counted per replica.
  #   - name: API_KEY_RATE_LIMIT_PER_MINUTE
  #     value: "600"
  #   # Encrypts secrets users save in notification settings (webhook signing
  #   # secrets, ntfy/Gotify tokens); without it saving one answers 503.
  #   - name: NOTIFICATION_SECRET_ENCRYPTION_KEY
  #     valueFrom:
  #       secretKeyRef:
  #         name: margaya-notification-secrets
  #         key: encryption-key
  #   # Web push. Off until both keys are set; generate them once with the
  #   # admin CLI's generate-push-keys command and keep them stable.
  #   # VAPID_SUBJECT is a mailto: or https:// contact for push services;
  #   # unset, it is MARGAYA_CLIENT_URL when that is https://. Replace the
  #   # example address: Apple's push service may refuse it.
  #   - name: VAPID_PUBLIC_KEY
  #     value: ""
  #   - name: VAPID_PRIVATE_KEY
  #     valueFrom:
  #       secretKeyRef:
  #         name: margaya-push-keys
  #         key: private-key
  #   - name: VAPID_SUBJECT
  #     value: "mailto:admin@example.com"
  #   # Seconds email notifications wait to be sent as one email per person
  #   # (default 300); 0 sends each one immediately.
  #   - name: EMAIL_NOTIFICATION_BATCH_WINDOW_SECONDS
  #     value: "300"
  #   # Days a deleted task or project stays in the trash (default 30; 0
  #   # turns the automatic purge off).
  #   - name: TRASH_RETENTION_DAYS
  #     value: "30"
  #   # Days the workspace webhook delivery log is kept (1-90, default 14).
  #   - name: WEBHOOK_DELIVERY_RETENTION_DAYS
  #     value: "14"
  #   # Days workspace audit log entries are kept (default 365; 0 = forever).
  #   - name: AUDIT_LOG_RETENTION_DAYS
  #     value: "365"
  #   # Days instance audit trail entries are kept (default 365; 0 = forever).
  #   - name: INSTANCE_AUDIT_LOG_RETENTION_DAYS
  #     value: "365"
  #   # Days the per-key API request log is kept (default 14, at most 365);
  #   # API_REQUEST_LOG_ENABLED=false turns the log off.
  #   - name: API_REQUEST_LOG_RETENTION_DAYS
  #     value: "14"
  #   # Sign-in policy (each locks its setting in the instance panel):
  #   # domains new accounts must use, password sign-up kept for invitations,
  #   # one required sign-in provider (admins keep password sign-in), and the
  #   # session lifetime in hours (default 168).
  #   - name: ALLOWED_EMAIL_DOMAINS
  #     value: "example.com"
  #   - name: ALLOW_INVITED_PASSWORD_REGISTRATION
  #     value: "true"
  #   - name: REQUIRED_SIGN_IN_PROVIDER
  #     value: "custom"
  #   - name: SESSION_LIFETIME_HOURS
  #     value: "168"
  #   # Turns every published project board off (links answer 404).
  #   - name: DISABLE_PUBLIC_BOARDS
  #     value: "true"
  #   # Name on the sign-in screen and public boards (locks it in the panel).
  #   - name: MARGAYA_INSTANCE_NAME
  #     value: "Margaya"
  #   # Show signed-out visitors the product landing page at the web root
  #   # (default true; false sends them to sign-in). Locks it in the panel.
  #   - name: MARGAYA_PUBLIC_LANDING
  #     value: "false"
  #   # Ignore settings saved in the instance admin panel and make it
  #   # read-only. Any variable set here always locks its own setting.
  #   - name: MARGAYA_LOCK_INSTANCE_SETTINGS
  #     value: "true"
  extraEnvFrom: []
  # extraEnvFrom:
  #   - secretRef:
  #       name: oauth-secret
  # Liveness only asks whether the process runs, so a database outage doesn't
  # restart the pods. Readiness tests the database and takes the pod out of
  # the Service until it answers again.
  livenessProbe:
    httpGet:
      path: /api/health
      port: margaya
    initialDelaySeconds: 60
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /api/health/ready
      port: margaya
    initialDelaySeconds: 30
    periodSeconds: 10
    # The API gives up on the database after 3 seconds and answers 503.
    timeoutSeconds: 5
# Ingress configuration
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: margaya.local
      paths:
        - path: /
          pathType: Prefix
          service: margaya
          port: 5173
  tls: []

# Gateway API configuration
gateway:
  enabled: false
  annotations: {}
  labels: {}
  parentRefs: []
  hostnames: []
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - service: margaya
          port: 5173
