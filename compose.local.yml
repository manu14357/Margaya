services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U margaya -d margaya"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "1337:1337"
    env_file:
      - .env.local
    environment:
      # Attachments and images when no S3 bucket is configured.
      MARGAYA_STORAGE_DIR: ${MARGAYA_STORAGE_DIR:-/app/apps/api/data/uploads}
    volumes:
      - uploads_data:/app/apps/api/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Optional local AI model (profile "ai-local"; never started by default).
  # Start it with: docker compose --profile ai-local up -d
  # then pull a model: docker compose exec ollama ollama pull llama3.3
  # and point Margaya at it: MARGAYA_AI_LOCAL_BASE_URL=http://ollama:11434/v1
  # with MARGAYA_AI_LOCAL_MODEL=llama3.3 (or set both in Instance → AI).
  ollama:
    image: ollama/ollama:0.40.8
    profiles: ["ai-local"]
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

#  Optional
#  redis:
#    image: valkey/valkey
#    ports:
#      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:5173"
    env_file:
      - .env.local
    environment:
      MARGAYA_PUBLIC_SITE_URL: ${MARGAYA_PUBLIC_SITE_URL:-http://localhost:3001}
    depends_on:
      - api
    restart: unless-stopped

  # Public website; it also serves the documentation at /docs.
  site:
    build:
      context: .
      dockerfile: apps/site/Dockerfile
    ports:
      - "3001:3001"
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  ollama_data:
