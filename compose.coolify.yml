# Margaya on Coolify
#
# Deploy this stack from a Git source with Coolify's "Docker Compose" build pack:
#   Public Repository -> https://github.com/manu14357/Margaya
#   Build Pack: Docker Compose | Base Directory: / | Compose Location: compose.coolify.yml
#
# Assign a domain to the "margaya" service using its container port, e.g. https://margaya.example.com:5173
# (visitors use the normal HTTPS URL; the port only tells Coolify where to route traffic).
#
# The only required environment variable is MARGAYA_CLIENT_URL (your public URL, without :5173).
# AUTH_SECRET and the PostgreSQL password are auto-generated via Coolify magic variables.
# Do NOT set MARGAYA_API_URL — the entrypoint derives it from MARGAYA_CLIENT_URL (public URL + /api).
# The Margaya image tracks the latest release by default. Set MARGAYA_IMAGE_TAG to a
# release tag to hold a deployment on a known version.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=margaya
      - POSTGRES_USER=margaya
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U margaya -d margaya"]
      interval: 10s
      timeout: 5s
      retries: 5

  margaya:
    # Tracks the latest release. The API runs database migrations on startup, so
    # set MARGAYA_IMAGE_TAG to a release tag if a redeploy should stay on a known
    # version rather than pick up whatever is newest.
    image: ghcr.io/manu14357/margaya:${MARGAYA_IMAGE_TAG:-latest}
    environment:
      - MARGAYA_CLIENT_URL=${MARGAYA_CLIENT_URL:?}
      - AUTH_SECRET=${SERVICE_HEX_64_MARGAYA:?}
      # The image derives DATABASE_URL from these POSTGRES_* variables at startup.
      # POSTGRES_PASSWORD is the same generated value shared with the postgres service.
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=margaya
      - POSTGRES_USER=margaya
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      # Attachments and images when no S3 bucket is configured.
      - MARGAYA_STORAGE_DIR=/app/apps/api/data/uploads
      # Database connections per instance and the longest a query may run
      # (ms, 0 = the server's setting). Startup migrations have no limit.
      - DATABASE_POOL_MAX=${DATABASE_POOL_MAX:-10}
      - DATABASE_STATEMENT_TIMEOUT_MS=${DATABASE_STATEMENT_TIMEOUT_MS:-300000}
      # Monitoring, all off by default (docs: Monitoring): Prometheus metrics
      # at /api/metrics need MARGAYA_METRICS_TOKEN; the access log and JSON
      # logs go to stdout; the update check shows admins a newer release.
      - MARGAYA_METRICS_ENABLED=${MARGAYA_METRICS_ENABLED:-false}
      - MARGAYA_METRICS_TOKEN=${MARGAYA_METRICS_TOKEN:-}
      - MARGAYA_ACCESS_LOG=${MARGAYA_ACCESS_LOG:-false}
      - MARGAYA_LOG_FORMAT=${MARGAYA_LOG_FORMAT:-text}
      - MARGAYA_UPDATE_CHECK=${MARGAYA_UPDATE_CHECK:-}
      # Optional: SMTP_*, SSO providers, GitHub integration, Sentry, Redis...
      # add them here or in the Coolify UI for the margaya service.
    volumes:
      - uploads_data:/app/apps/api/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  postgres_data:
  uploads_data:
