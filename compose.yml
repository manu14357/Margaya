services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-margaya}
      POSTGRES_DB: ${POSTGRES_DB:-margaya}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

  margaya:
    image: ghcr.io/manu14357/margaya:latest
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      # Attachments and images when no S3 bucket is configured.
      MARGAYA_STORAGE_DIR: ${MARGAYA_STORAGE_DIR:-/app/apps/api/data/uploads}
      # Monitoring, all off by default (docs: Monitoring). Metrics need a
      # token (GET /api/metrics) or a port; to scrape the port, also publish
      # it below, e.g. "127.0.0.1:9464:9464".
      MARGAYA_METRICS_ENABLED: ${MARGAYA_METRICS_ENABLED:-false}
      MARGAYA_METRICS_TOKEN: ${MARGAYA_METRICS_TOKEN:-}
      MARGAYA_METRICS_PORT: ${MARGAYA_METRICS_PORT:-}
      MARGAYA_ACCESS_LOG: ${MARGAYA_ACCESS_LOG:-false}
      MARGAYA_LOG_FORMAT: ${MARGAYA_LOG_FORMAT:-text}
      # Daily check for a newer release, shown to instance admins only. Empty
      # leaves the switch to Instance > Health.
      MARGAYA_UPDATE_CHECK: ${MARGAYA_UPDATE_CHECK:-}
      # Database connections per instance and the longest a query may run
      # (ms, 0 = the server's setting). Startup migrations have no limit.
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-300000}
    volumes:
      - uploads_data:/app/apps/api/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # Optional local AI model (profile "ai-local"; never started by default).
  # Start it with: docker compose --profile ai-local up -d
  # then pull a model: docker compose exec ollama ollama pull llama3.3
  # and point Margaya at it: MARGAYA_AI_LOCAL_BASE_URL=http://ollama:11434/v1
  # with MARGAYA_AI_LOCAL_MODEL=llama3.3 (or set both in Instance → AI).
  ollama:
    image: ollama/ollama:0.40.8
    profiles: ["ai-local"]
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

#  Optional for HA Setup
